name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install available dependencies
        run: |
          python -m pip install --upgrade pip
          for f in $(find . -name requirements.txt -not -path '*/node_modules/*'); do pip install -r "$f" || true; done
      - name: Compile Python
        run: python -m compileall -q .

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - name: Build available frontends
        shell: bash
        run: |
          set +e
          for p in $(find . -name package.json -not -path '*/node_modules/*'); do
            d=$(dirname "$p")
            if [ -f "$d/package-lock.json" ]; then
              npm ci --prefix "$d" && npm run build --prefix "$d"
            fi
          done
